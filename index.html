<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Download File</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
        }

        .download-card {
            width: 90%;
            max-width: 450px;
            padding: 45px 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            color: white;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        p {
            color: #dbeafe;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px 35px;
            background: #ffffff;
            color: #1e3a8a;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            border-radius: 50px;
            transition: 0.3s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
        }

        .download-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 12px 30px rgba(0,0,0,0.35);
        }

        .download-btn:active {
            transform: scale(0.97);
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #bfdbfe;
        }
    </style>
</head>

<body>

    <div class="download-card">

        <div class="icon">📥</div>

        <h1>Download File</h1>

        <p>
            Your file is ready to download.
            Click the button below to continue.
        </p>

        <a
            href="https://drive.google.com/file/d/1Gvct8fO8cFWrNo1X9QxUEG5v_bQT9M2y/view?usp=sharing"
            target="_blank"
            rel="noopener noreferrer"
            class="download-btn"
        >
            ⬇ Download
        </a>

        <div class="footer">
            Secure Google Drive Download
        </div>

    </div>

</body>
</html>
